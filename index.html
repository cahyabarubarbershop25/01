<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cahya Baru Barbershop - POS & Kasir</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

    <!-- Header Navigation -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid font-bold text-amber-500 fa-scissors text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">Cahya Baru Barbershop</h1>
            </div>
            <div id="connection-status" class="text-xs px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 font-medium flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Firebase Terhubung
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Left Column: Service & Barber Selection -->
        <section class="lg:col-span-2 space-y-6">
            
            <!-- Barber Selection -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-base font-semibold mb-3 flex items-center gap-2 text-slate-700">
                    <i class="fa-solid fa-user-gear text-amber-500"></i> Pilih Kapster / Barber
                </h2>
                <div class="grid grid-cols-3 gap-3" id="barber-list">
                    <button type="button" onclick="selectBarber('Barber 1', this)" class="barber-btn p-3 rounded-lg border-2 border-slate-200 hover:border-amber-500 font-medium text-slate-700 transition-all text-center">
                        Barber 1
                    </button>
                    <button type="button" onclick="selectBarber('Barber 2', this)" class="barber-btn p-3 rounded-lg border-2 border-slate-200 hover:border-amber-500 font-medium text-slate-700 transition-all text-center">
                        Barber 2
                    </button>
                    <button type="button" onclick="selectBarber('Barber 3', this)" class="barber-btn p-3 rounded-lg border-2 border-slate-200 hover:border-amber-500 font-medium text-slate-700 transition-all text-center">
                        Barber 3
                    </button>
                </div>
            </div>

            <!-- Service Selection -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-base font-semibold mb-3 flex items-center gap-2 text-slate-700">
                    <i class="fa-solid fa-list-check text-amber-500"></i> Pilih Layanan
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="service-list">
                    <button type="button" onclick="addService('Potong Rambut', 35000)" class="p-4 rounded-lg border border-slate-200 hover:border-amber-500 hover:shadow-md transition-all text-left flex justify-between items-center bg-slate-50 hover:bg-amber-50/30">
                        <div>
                            <p class="font-semibold text-slate-800">Potong Rambut</p>
                            <p class="text-xs text-slate-500">Gunting & Styling</p>
                        </div>
                        <span class="font-bold text-amber-600">Rp 35.000</span>
                    </button>
                    <button type="button" onclick="addService('Cukur Kumis/Jenggot', 15000)" class="p-4 rounded-lg border border-slate-200 hover:border-amber-500 hover:shadow-md transition-all text-left flex justify-between items-center bg-slate-50 hover:bg-amber-50/30">
                        <div>
                            <p class="font-semibold text-slate-800">Cukur Jenggot</p>
                            <p class="text-xs text-slate-500">Trim & Shave</p>
                        </div>
                        <span class="font-bold text-amber-600">Rp 15.000</span>
                    </button>
                    <button type="button" onclick="addService('Cuci & Creambath', 30000)" class="p-4 rounded-lg border border-slate-200 hover:border-amber-500 hover:shadow-md transition-all text-left flex justify-between items-center bg-slate-50 hover:bg-amber-50/30">
                        <div>
                            <p class="font-semibold text-slate-800">Cuci & Creambath</p>
                            <p class="text-xs text-slate-500">Perawatan Kulit Kepala</p>
                        </div>
                        <span class="font-bold text-amber-600">Rp 30.000</span>
                    </button>
                    <button type="button" onclick="addService('Pewarnaan Rambut', 75000)" class="p-4 rounded-lg border border-slate-200 hover:border-amber-500 hover:shadow-md transition-all text-left flex justify-between items-center bg-slate-50 hover:bg-amber-50/30">
                        <div>
                            <p class="font-semibold text-slate-800">Pewarnaan Rambut</p>
                            <p class="text-xs text-slate-500">Hair Color / Cat</p>
                        </div>
                        <span class="font-bold text-amber-600">Rp 75.000</span>
                    </button>
                </div>
            </div>

            <!-- Realtime Recent Transactions List -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-base font-semibold mb-3 flex items-center gap-2 text-slate-700">
                    <i class="fa-solid fa-clock-rotate-left text-amber-500"></i> Transaksi Terakhir (Realtime)
                </h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-slate-600">
                        <thead class="text-xs text-slate-700 uppercase bg-slate-100">
                            <tr>
                                <th class="px-4 py-2">Pelanggan</th>
                                <th class="px-4 py-2">Barber</th>
                                <th class="px-4 py-2">Total</th>
                                <th class="px-4 py-2">Waktu</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-history">
                            <tr>
                                <td colspan="4" class="px-4 py-4 text-center text-slate-400">Memuat data transaksi...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </section>

        <!-- Right Column: Cart / Checkout Panel -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 h-fit space-y-4 sticky top-20">
            <h2 class="text-lg font-bold text-slate-800 border-b pb-3 flex items-center gap-2">
                <i class="fa-solid fa-receipt text-amber-500"></i> Rincian Transaksi
            </h2>

            <!-- Customer Details Input -->
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Pelanggan</label>
                    <input type="text" id="customer-name" placeholder="Masukkan nama..." class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Barber Terpilih</label>
                    <input type="text" id="selected-barber" readonly placeholder="Belum dipilih" class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-100 text-slate-600 font-medium">
                </div>
            </div>

            <!-- Selected Services Cart -->
            <div class="border-t border-b py-3 space-y-2 min-h-[120px] max-h-[220px] overflow-y-auto" id="cart-items">
                <p class="text-xs text-slate-400 text-center py-8">Belum ada layanan yang dipilih</p>
            </div>

            <!-- Subtotal & Total -->
            <div class="space-y-2 pt-2">
                <div class="flex justify-between text-base font-bold text-slate-800">
                    <span>Total Pembayaran</span>
                    <span id="total-price" class="text-amber-600">Rp 0</span>
                </div>
            </div>

            <!-- Action Button -->
            <button type="button" onclick="processTransaction()" id="btn-submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-lg shadow-md transition-all flex justify-center items-center gap-2">
                <i class="fa-solid fa-check-circle"></i> Selesaikan Transaksi
            </button>
        </section>

    </main>

    <!-- Firebase SDK Modular (v10) Script -->
    <script type="module">
        // Import Firebase Functions dari CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            query, 
            orderBy, 
            limit, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Konfigurasi Firebase milik Cahya Baru Barbershop
        const firebaseConfig = {
            apiKey: "AIzaSyDmsqZ9qclpGEy0xs7c8qGN6Ivevrb3ifo",
            authDomain: "cahyabaru-barbershop.firebaseapp.com",
            projectId: "cahyabaru-barbershop",
            storageBucket: "cahyabaru-barbershop.firebasestorage.app",
            messagingSenderId: "779234778148",
            appId: "1:779234778148:web:76d74fa3bb8e4ef242ccb1",
            measurementId: "G-210J429G0K"
        };

        // Inisialisasi Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global State Transaksi
        window.cart = [];
        window.selectedBarberName = "";

        // Fungsi Pilih Barber
        window.selectBarber = function(name, element) {
            window.selectedBarberName = name;
            document.getElementById('selected-barber').value = name;
            
            document.querySelectorAll('.barber-btn').forEach(btn => {
                btn.classList.remove('border-amber-500', 'bg-amber-50', 'text-amber-700');
                btn.classList.add('border-slate-200');
            });
            
            element.classList.remove('border-slate-200');
            element.classList.add('border-amber-500', 'bg-amber-50', 'text-amber-700');
        };

        // Fungsi Tambah Layanan ke Keranjang
        window.addService = function(name, price) {
            window.cart.push({ name, price });
            renderCart();
        };

        // Fungsi Hapus Layanan
        window.removeService = function(index) {
            window.cart.splice(index, 1);
            renderCart();
        };

        // Render Keranjang & Total
        function renderCart() {
            const container = document.getElementById('cart-items');
            const totalElement = document.getElementById('total-price');

            if (window.cart.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-8">Belum ada layanan yang dipilih</p>`;
                totalElement.innerText = "Rp 0";
                return;
            }

            let html = "";
            let total = 0;

            window.cart.forEach((item, index) => {
                total += item.price;
                html += `
                    <div class="flex justify-between items-center text-sm bg-slate-50 p-2 rounded border">
                        <div>
                            <p class="font-semibold text-slate-700">${item.name}</p>
                            <p class="text-xs text-slate-500">Rp ${item.price.toLocaleString('id-ID')}</p>
                        </div>
                        <button onclick="removeService(${index})" class="text-red-500 hover:text-red-700 p-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
            totalElement.innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        // Simpan Transaksi ke Firebase Firestore (Create CRUD)
        window.processTransaction = async function() {
            const customerName = document.getElementById('customer-name').value.trim();
            const barber = window.selectedBarberName;

            if (!barber) {
                alert("Harap pilih kapster/barber terlebih dahulu!");
                return;
            }
            if (window.cart.length === 0) {
                alert("Harap pilih setidaknya satu layanan!");
                return;
            }

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Menyimpan...`;

            try {
                const totalAmount = window.cart.reduce((sum, item) => sum + item.price, 0);
                
                await addDoc(collection(db, "transactions"), {
                    customerName: customerName || "Umum/Pelanggan",
                    barber: barber,
                    services: window.cart,
                    totalAmount: totalAmount,
                    createdAt: serverTimestamp()
                });

                alert("Transaksi berhasil disimpan ke Firebase!");
                
                // Reset Form
                window.cart = [];
                window.selectedBarberName = "";
                document.getElementById('customer-name').value = "";
                document.getElementById('selected-barber').value = "";
                document.querySelectorAll('.barber-btn').forEach(b => b.classList.remove('border-amber-500', 'bg-amber-50', 'text-amber-700'));
                renderCart();

            } catch (error) {
                console.error("Gagal menyimpan transaksi: ", error);
                alert("Terjadi kesalahan saat menyimpan transaksi.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-check-circle"></i> Selesaikan Transaksi`;
            }
        };

        // Stream Data Realtime Transaksi Terakhir (Read CRUD)
        function listenToTransactions() {
            const q = query(collection(db, "transactions"), orderBy("createdAt", "desc"), limit(5));
            
            onSnapshot(q, (snapshot) => {
                const tbody = document.getElementById('transaction-history');
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-4 text-center text-slate-400">Belum ada riwayat transaksi.</td></tr>`;
                    return;
                }

                let rows = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const date = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) : '-';
                    rows += `
                        <tr class="border-b bg-white hover:bg-slate-50">
                            <td class="px-4 py-3 font-medium text-slate-800">${data.customerName}</td>
                            <td class="px-4 py-3">${data.barber}</td>
                            <td class="px-4 py-3 font-bold text-amber-600">Rp ${data.totalAmount ? data.totalAmount.toLocaleString('id-ID') : 0}</td>
                            <td class="px-4 py-3 text-xs text-slate-400">${date}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = rows;
            }, (error) => {
                console.error("Error snapshot: ", error);
            });
        }

        // Jalankan pendengar realtime saat halaman dimuat
        listenToTransactions();
    </script>
</body>
</html>
